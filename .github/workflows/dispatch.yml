name: Dispatcher
on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch: {}
permissions: { contents: read }
concurrency: { group: paper-english-dispatcher, cancel-in-progress: false }
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm social dispatch-due
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          PAUSE_ALL_POSTING: ${{ vars.PAUSE_ALL_POSTING || 'true' }}
          FACEBOOK_ENABLED: ${{ vars.FACEBOOK_ENABLED || 'false' }}
          INSTAGRAM_ENABLED: ${{ vars.INSTAGRAM_ENABLED || 'false' }}
          THREADS_ENABLED: ${{ vars.THREADS_ENABLED || 'false' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ vars.BUFFER_FACEBOOK_CHANNEL_ID || secrets.BUFFER_FACEBOOK_CHANNEL_ID || '' }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ vars.BUFFER_INSTAGRAM_CHANNEL_ID || secrets.BUFFER_INSTAGRAM_CHANNEL_ID || '' }}
          BUFFER_THREADS_CHANNEL_ID: ${{ vars.BUFFER_THREADS_CHANNEL_ID || secrets.BUFFER_THREADS_CHANNEL_ID || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
